<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#171b28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Party Board">
<title>Ivalice Chronicles — Party Progression Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <nav class="views" id="viewNav" aria-label="Sections">
    <button class="view-tab" type="button" role="tab" data-view="characters" aria-selected="false">Characters</button>
    <button class="view-tab" type="button" role="tab" data-view="guides" aria-selected="false">Guides</button>
    <button class="view-tab" type="button" role="tab" data-view="checklists" aria-selected="false">Checklists</button>
  </nav>

  <div class="view" id="view-characters">
    <div class="legend" id="legend"></div>

    <div class="party-progress">
      <div class="party-progress-track"><div class="party-progress-fill" id="partyFill"></div></div>
      <div class="party-progress-label" id="partyLabel"></div>
    </div>

    <div class="controls">
      <label class="toggle"><input type="checkbox" id="hideDone"><span>Hide completed skills</span></label>
    </div>

    <nav class="tabs" id="tabs" role="tablist" aria-label="Characters"></nav>

    <div id="board"></div>
  </div>

  <div class="view" id="view-guides">
    <section id="overview" aria-label="Party strategy"></section>
    <section id="timeline" aria-label="Party makeup over time"></section>
    <section id="battles" aria-label="Key battles"></section>
  </div>

  <div class="view" id="view-checklists">
    <section id="missables" aria-label="Missables checklist"></section>
    <section id="poach" aria-label="Rare poaching tracker"></section>
    <section id="treasure" aria-label="Treasure Hunter map"></section>
    <section id="shop" aria-label="Shop and Fur Shop progression"></section>
  </div>

  <footer id="footer"></footer>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
